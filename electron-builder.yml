appId: com.epdf.app
productName: Epdf
copyright: Copyright © 2026 Meshal AlMannai
directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # OCR (tesseract.js-core): the six engines (plain / SIMD / relaxed-SIMD, each with and without the legacy models)
  # are loaded from disk as `<name>.js` + `<name>.wasm`. The `.wasm.js` copies with the WebAssembly embedded as
  # base64 are for browsers and never used in Node; dropping them saves ~25 MB.
  - '!**/node_modules/tesseract.js-core/*.wasm.js'

# better-sqlite3 v13 ships N-API prebuilds for win/mac/linux (x64 + arm64), so no compiler toolchain
# (Visual Studio / Xcode) is needed and there is nothing to rebuild against Electron's ABI.
npmRebuild: false

# Native helper tools (qpdf, tesseract, ...) live in resources/bin/<platform>-<arch>/ and ship next to the
# app as <resources>/bin (see src/main/services/tools.ts). Nothing is committed there; see README.
extraResources:
  - from: resources/bin/${os}-${arch}
    to: bin
    filter: ['**/*']
  # Bundled fonts (SIL OFL / Apache-2.0) with their license texts: signature script fonts, the Unicode font
  # for form text, and the fonts of the built-in Office converter (Liberation, Carlito, Caladea, Noto Sans).
  - from: resources/fonts
    to: fonts
    filter: ['*.ttf', '*.txt']
  # The text engine adds the Noto script fonts (Arabic, Hebrew, Thai, Indic, CJK .otf, symbols, emoji) in textfonts/,
  # with the font catalogue text-fonts.json and licence notices, and the two HarfBuzz WebAssembly modules (text/).
  - from: resources/textfonts
    to: textfonts
    filter: ['*.ttf', '*.otf', '*.json', '*.txt']
  - from: resources/text
    to: text
    filter: ['*.wasm', '*.txt']
  # OCR: the English trained data (tessdata_fast, Apache-2.0) with its license. Other languages are downloaded on demand.
  - from: resources/ocr
    to: ocr
    filter: ['*.traineddata', '*.txt']
  # License texts of every bundled package, font and WebAssembly module, written by `npm run build`
  # (scripts/lib/notices.mjs). Help > Third-Party Notices opens it.
  - from: out/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: LICENSE.md
    to: LICENSE.txt # .txt: Windows has no default app for .md
  - from: build/license.txt
    to: EULA.txt

# Native modules cannot be loaded from inside an asar archive. The OCR engine runs in worker threads that
# tesseract.js starts from its own script file and that load the WebAssembly core from disk, so tesseract.js,
# its core and the few modules its worker script requires must live outside the archive.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'
  - '**/node_modules/wasm-feature-detect/**'
  - '**/node_modules/regenerator-runtime/**'
  - '**/node_modules/is-url/**'
  - '**/node_modules/bmp-js/**'

# Register as a handler for .pdf ("Open with", double-click, drag onto the app icon).
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Editor
    icon: icon

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: universal # one build for Apple Silicon + Intel
    - target: zip # required by electron-updater on macOS (Phase 5)
      arch: universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing + notarization are driven by the environment; see README ("Code signing").
  #   CSC_LINK / CSC_KEY_PASSWORD        Developer ID Application certificate (.p12)
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarization
  notarize: false # flipped on in CI once the Apple credentials exist (see README)
  # The universal build merges two arch-specific bundles; the native addon ships prebuilds for both,
  # so the merge only needs to tolerate identical files.
  x64ArchFiles: '**/better-sqlite3/**'

dmg:
  title: Epdf ${version}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  # Windows signing is driven by the environment (CSC_LINK / CSC_KEY_PASSWORD) or an Azure Trusted
  # Signing config; see README ("Code signing"). Unsigned local builds work without either.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false # user data (settings, library index, signatures) survives an uninstall
  include: build/installer.nsh # Explorer right-click entries ("Convert to PDF", "Combine files")
  # One installer in several languages: it starts in the language of Windows (no picker), Arabic is right-to-left.
  # The end user license agreement: a page the user must accept ("I Agree") before anything is installed. The same
  # text ships as EULA.txt (Help > End User License Agreement). English in every installer language (English prevails).
  license: build/license.txt
  multiLanguageInstaller: true
  installerLanguages: [en_US, ar_SA, fr_FR, de_DE, es_ES]
  displayLanguageSelector: false
  runAfterFinish: true
  artifactName: Epdf-Setup-${version}.${ext} # no spaces: friendlier in update URLs and download links

# Where the installed app looks for updates (Help > Check for Updates): the public releases of Mannai/epdf-releases
# (installers only, separate from the source repository; a public feed needs no token in the app). A release is tagged
# v<version>; its assets are the installers, their .blockmap files, latest.yml (Windows) and latest-linux.yml.
# Betas are GitHub pre-releases, and a beta build looks for pre-releases (allowPrerelease in features/updates).
# See docs/DEVELOPMENT.md ("Updates").
publish:
  - provider: github
    owner: Mannai
    repo: epdf-releases
    releaseType: prerelease

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Office
  # (application/pdf comes from fileAssociations above; listing it here too repeated it in the desktop entry)
  icon: build/icons # 16...1024 px, so menus, docks and file managers get a sharp icon at every size
  executableName: epdf # lowercase command and desktop entry id (epdf.desktop), as Linux expects
  maintainer: Meshal AlMannai <support@epdf.ing>
  vendor: Meshal AlMannai
  synopsis: Every PDF tool in one offline app
  description: >-
    View, edit, sign, redact, OCR and compare PDFs in any language, right-to-left included. Fully offline.
  artifactName: Epdf-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: Epdf
      GenericName: PDF Editor
      Comment: View, edit, sign, redact, OCR and compare PDFs
      Keywords: PDF;Editor;Viewer;Sign;Redact;OCR;Arabic;
      StartupWMClass: Epdf
      Actions: NewWindow;
    desktopActions:
      NewWindow:
        Name: New Window
        Exec: epdf --new-window
# The .deb needs the libraries Electron uses; libsecret keeps saved signatures in the desktop keyring.
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libasound2 | libasound2t64]
